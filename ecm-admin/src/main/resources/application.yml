spring:
  application:
    name: ecm-admin

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  datasource:
    url: jdbc:postgresql://localhost:5432/ecmdb
    username: ecmuser
    password: ecmpassword
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: AdminServicePool
      maximum-pool-size: 5
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ecm_admin
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    schemas: ecm_admin
    baseline-on-migrate: true
    locations: classpath:db/migration
    ignore-migration-patterns: "*:missing"

  data:
    redis:
      host: localhost
      port: 6379
      password: ecmredispassword

  rabbitmq:
    host: localhost
    port: 5672
    username: ecmrabbit
    password: ecmrabbitpassword
    virtual-host: ecm
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 10000

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://integrator-3023444.okta.com/oauth2/ausykohz3k9z4e9Wy697

  # ── Spring AI MCP Server ────────────────────────────────────────────
  # Exposes ECM tools (13 read-only SELECT queries) to the AI Gateway via
  # real MCP JSON-RPC 2.0 over HTTP+SSE transport. LangChain4j's HttpMcpTransport
  # on the gateway side connects to /mcp/sse, receives an `endpoint` SSE event
  # pointing at /mcp/message, and then exchanges JSON-RPC messages on that path.
  #
  # Legacy shape (McpServerController at /mcp/tools + /mcp/tools/{name}/execute)
  # stays in place during the migration window for rollback safety. Both paths
  # share business logic via McpToolService. See HANDOFF_ECM_JSON_RPC_MCP.md.
  ai:
    mcp:
      server:
        enabled: true
        name: ecm-mcp
        version: 1.0.0
        type: SYNC
        sse-endpoint: /mcp/sse
        sse-message-endpoint: /mcp/message
        instructions: >
          Read-only ECM platform tools — search documents, customers, cases,
          workflows, forms, and retrieve platform statistics.

server:
  port: 8086

okta:
  oauth2:
    audience: api://sso-default

ecm:
  master-encrypt-key: ${MASTER_ENCRYPT_KEY:b5+BMrlFk333DFKoF2Sl1GJpeRc6KbfHcv1rp9WC9gY=}
  security:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  services:
    workflow-url: ${WORKFLOW_URL:http://localhost:8083}
  external:
    session-secret: ${EXTERNAL_SESSION_SECRET:ecm-dev-session-secret-32chars!!}
  internal:
    api-key: ${INTERNAL_API_KEY:ecm-internal-dev-key}

management:
  # Micrometer tracing — sampling probability
  tracing:
    sampling:
      probability: 1.0     # 100% in dev; set to 0.1 (10%) in azure profile

  # OTLP exporter endpoint — where to send traces
  # Spring Boot 3.2+ auto-configures OtlpHttpSpanExporter when this is set
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces   # Jaeger OTLP/HTTP receiver
    # Prometheus metrics endpoint
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name} # label all metrics with service name
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

logging:
  level:
    com.ecm.admin: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO

---
spring:
  config:
    activate:
      on-profile: azure
  datasource:
    url: ${AZURE_DB_URL}
    username: ${AZURE_DB_USER}
    password: ${AZURE_DB_PASS}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OKTA_ISSUER_URI}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASS}
    virtual-host: ${RABBITMQ_VHOST:ecm}
okta:
  oauth2:
    audience: ${OKTA_AUDIENCE}
ecm:
  security:
    allowed-origins: ${CORS_ORIGINS}
  services:
    workflow-url: ${WORKFLOW_URL}
  internal:
    api-key: ${INTERNAL_API_KEY}
