global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'ecm-gateway'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['ecm-gateway:8080']

  - job_name: 'ecm-admin'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['ecm-admin:8081']

  - job_name: 'ecm-document'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['ecm-document:8082']

  - job_name: 'ecm-workflow'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['ecm-workflow:8083']

  - job_name: 'ecm-eforms'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['ecm-eforms:8084']

  - job_name: 'ecm-notification'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['ecm-notification:8085']
