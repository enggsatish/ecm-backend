server:
  port: 8080
  # Increase Netty connection timeout for large file uploads
  netty:
    connection-timeout: 30s

spring:
  application:
    name: ecm-gateway

  # ── WebFlux codec buffer size ──────────────────────────────────────────────
  # DEFAULT IS 256 KB — FAR TOO SMALL FOR FILE UPLOADS.
  #
  # Spring Cloud Gateway uses WebFlux's reactive codec to handle request/response
  # streaming. The default max-in-memory-size of 256 KB (262144 bytes) causes a
  # DataBufferLimitException for any multipart upload exceeding that size.
  #
  # When this limit is hit, WebFlux cancels the reactive publisher mid-stream.
  # Because the gateway is a streaming proxy, the upstream (ecm-document) may
  # have ALREADY processed the request — the document IS saved and 201 is sent.
  # But the response body chunk stream is cancelled before the terminal chunk
  # reaches the browser, producing:
  #   ERR_INCOMPLETE_CHUNKED_ENCODING 201 (Created)
  #
  # Setting this to 50 MB matches ecm-document's multipart.max-file-size.
  # This setting applies to BOTH request and response codec buffering in the gateway.
  codec:
    max-in-memory-size: 52428800   # 50 MB — must match ecm-document's max-file-size

  # ── Redis (rate limiting) ──────────────────────────────────────────────────
  data:
    redis:
      host:     ${REDIS_HOST:localhost}
      port:     ${REDIS_PORT:6379}
      password: ${REDIS_PASS:ecmredispassword}
      timeout:  2000ms
      # Reactive Lettuce connection pool
      lettuce:
        pool:
          max-active:  10
          max-idle:    5
          min-idle:    2

  # ── OAuth2 Resource Server ─────────────────────────────────────────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OKTA_ISSUER_URI:https://integrator-3023444.okta.com/oauth2/ausykohz3k9z4e9Wy697}

  # ── Cloud Gateway ─────────────────────────────────────────────────────────
  cloud:
    gateway:
      # Global timeout for all downstream calls
      httpclient:
        connect-timeout: 5000    # 5 seconds to establish connection
        response-timeout: 60s    # 60 seconds for response (covers large uploads)
        # Connection pool — shared across all downstream routes
        pool:
          max-connections:          500
          acquire-timeout:          45000
          max-idle-time:            20s
          max-life-time:            60s

      # Default filters applied to EVERY route
      default-filters:
        # Retry on 503 (service briefly unavailable) — only safe for GET
        - name: Retry
          args:
            retries:    2
            statuses:   SERVICE_UNAVAILABLE
            methods:    GET
            backoff:
              firstBackoff:   100ms
              maxBackoff:     500ms
              factor:         2

      # Expose gateway route info on actuator
      actuator:
        verbose:
          enabled: true

# ── Okta ─────────────────────────────────────────────────────────────────────
okta:
  oauth2:
    audience: ${OKTA_AUDIENCE:api://sso-default}

# ── ECM service URLs ──────────────────────────────────────────────────────────
ecm:
  identity:
    url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
  enrichment:
    timeout-ms: 2000
    cache-ttl-minutes: 15
  services:
    identity-url:  ${IDENTITY_SERVICE_URL:http://localhost:8081}
    document-url:  ${DOCUMENT_SERVICE_URL:http://localhost:8082}
    workflow-url:  ${WORKFLOW_SERVICE_URL:http://localhost:8083}
    eforms-url:    ${EFORMS_SERVICE_URL:http://localhost:8084}
    admin-url:     ${ADMIN_SERVICE_URL:http://localhost:8086}
    ocr-url:       ${OCR_SERVICE_URL:http://localhost:8087}
    notification-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8088}
  security:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200,http://localhost:3000}

# ── Resilience4j Circuit Breakers ─────────────────────────────────────────────
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType:             COUNT_BASED
        slidingWindowSize:             10
        failureRateThreshold:          50
        waitDurationInOpenState:       30s
        permittedNumberOfCallsInHalfOpenState: 2
        recordExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.cloud.gateway.support.NotFoundException
    instances:
      identity-cb:
        baseConfig: default
      document-cb:
        baseConfig: default
      workflow-cb:
        baseConfig: default
      eforms-cb:
        baseConfig: default
      admin-cb:
        baseConfig: default

  timelimiter:
    configs:
      default:
        timeoutDuration: 30s
    instances:
      identity-cb:
        timeoutDuration: 10s
      document-cb:
        timeoutDuration: 60s    # Uploads can take longer
      workflow-cb:
        timeoutDuration: 15s
      eforms-cb:
        timeoutDuration: 15s
      admin-cb:
        timeoutDuration: 15s

# ── Actuator ──────────────────────────────────────────────────────────────────
management:
  # Micrometer tracing — sampling probability
  tracing:
    sampling:
      probability: 1.0     # 100% in dev; set to 0.1 (10%) in azure profile

  # OTLP exporter endpoint — where to send traces
  # Spring Boot 3.2+ auto-configures OtlpHttpSpanExporter when this is set
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces   # Jaeger OTLP/HTTP receiver
    # Prometheus metrics endpoint
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name} # label all metrics with service name
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: when-authorized
    gateway:
      enabled: true
  health:
    circuitbreakers:
      enabled: true

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    com.ecm.gateway:                          DEBUG
    org.springframework.cloud.gateway:        INFO
    org.springframework.security:             INFO
    reactor.netty.http.client:                WARN
    io.github.resilience4j.circuitbreaker:    INFO
    # Uncomment to diagnose codec/buffer issues:
    # reactor.netty:                          DEBUG
    # io.netty.handler.codec:                 DEBUG
