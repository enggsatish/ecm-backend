spring:
  application:
    name: ecm-ocr

  # ── Database ──────────────────────────────────────────────────────
  datasource:
    url:               jdbc:postgresql://localhost:5432/ecmdb
    username:          ecmuser
    password:          ecmpassword
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name:         OcrServicePool
      maximum-pool-size: 4
      minimum-idle:      1
  opensearch:
    uris: ${OPENSEARCH_URIS:http://localhost:9200}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql:     false
    open-in-view: false

  flyway:
    enabled: false

  # ── RabbitMQ ────────────────────────────────────────────────────
  rabbitmq:
    host:         localhost
    port:         5672
    username:     ecmrabbit
    password:     ecmrabbitpassword
    virtual-host: ecm

  # ── OAuth2 ──────────────────────────────────────────────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://integrator-3023444.okta.com/oauth2/ausykohz3k9z4e9Wy697

server:
  port: 8087

okta:
  oauth2:
    audience: api://sso-default

# ── ECM OCR config ──────────────────────────────────────────────────
#
# Pipeline engines are configured dynamically via Admin → Settings → OCR Engine.
# These application.yml values are fallback defaults for fresh installs only.
#
ecm:
  services:
    admin-url: ${ECM_ADMIN_URL:http://localhost:8086}
  classification:
    confidence-threshold: ${CLASSIFICATION_THRESHOLD:90.0}
  minio:
    endpoint:         ${MINIO_ENDPOINT:http://localhost:9000}
    access-key:       ${MINIO_ACCESS_KEY:ecmminioadmin}
    secret-key:       ${MINIO_SECRET_KEY:ecmminio@password123}
    documents-bucket: ${MINIO_BUCKET:ecm-documents}

  opensearch:
    index-name: ecm-documents

  ocr:
    # ── General ────────────────────────────────────────────────────
    max-file-size-bytes: 52428800   # 50 MB — files above this skip OCR entirely

    # ── Scanned PDF detection ──────────────────────────────────────
    # If Tika extracts fewer than this many characters from a PDF, the
    # file is treated as a scanned PDF and page-by-page OCR is performed.
    scanned-pdf-text-threshold: 50
    scanned-pdf-max-pages: 100
    scanned-pdf-render-dpi: 300

    # ── RapidOCR container (local text extraction) ─────────────────
    rapidocr-enabled:          ${RAPIDOCR_ENABLED:true}
    rapidocr-url:              ${RAPIDOCR_URL:http://localhost:8884}
    rapidocr-api-path:         ${RAPIDOCR_API_PATH:/ocr}
    rapidocr-file-field:       ${RAPIDOCR_FILE_FIELD:image_file}
    rapidocr-timeout-seconds:  ${RAPIDOCR_TIMEOUT_SECONDS:60}

    # ── Ollama defaults (overridden by tenant_config pipeline JSON) ─
    # GLM-OCR 0.9B ≈ 2.2 GB model + ~1 GB KV cache.
    # On 16 GB Mac: keep_alive=5m unloads after idle to free memory.
    ollama-url:              ${OLLAMA_URL:http://localhost:11434}
    ollama-model:            ${OLLAMA_MODEL:glm-ocr}
    ollama-timeout-seconds:  ${OLLAMA_TIMEOUT_SECONDS:120}

    # ── Tika (Office doc text extraction only) ─────────────────────
    tika-languages: eng

  security:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200,http://localhost:3000}

management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.ecm.ocr:                  DEBUG
    org.apache.tika:              WARN
    org.apache.pdfbox:            WARN
    org.springframework.security: INFO

# ── Azure profile ────────────────────────────────────────────────────
---
spring:
  config:
    activate:
      on-profile: azure
  datasource:
    url:      ${AZURE_DB_URL}
    username: ${AZURE_DB_USER}
    password: ${AZURE_DB_PASS}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OKTA_ISSUER_URI}
  rabbitmq:
    host:         ${RABBITMQ_HOST}
    port:         ${RABBITMQ_PORT:5672}
    username:     ${RABBITMQ_USER}
    password:     ${RABBITMQ_PASS}
    virtual-host: ${RABBITMQ_VHOST:ecm}
okta:
  oauth2:
    audience: ${OKTA_AUDIENCE}
ecm:
  minio:
    endpoint:   ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
  opensearch:
    host: ${OPENSEARCH_HOST}
    port: ${OPENSEARCH_PORT:9200}
  security:
    allowed-origins: ${CORS_ORIGINS}
  ocr:
    rapidocr-enabled: ${RAPIDOCR_ENABLED:false}
    rapidocr-url:     ${RAPIDOCR_URL:http://localhost:8884}
