spring:
  application:
    name: ecm-ocr

  # ── Database ──────────────────────────────────────────────────────
  datasource:
    url:               jdbc:postgresql://localhost:5432/ecmdb
    username:          ecmuser
    password:          ecmpassword
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name:         OcrServicePool
      maximum-pool-size: 4
      minimum-idle:      1
  opensearch:
    uris: ${OPENSEARCH_URIS:http://localhost:9200}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql:     false
    open-in-view: false

  flyway:
    enabled: false

  # ── RabbitMQ ────────────────────────────────────────────────────
  rabbitmq:
    host:         localhost
    port:         5672
    username:     ecmrabbit
    password:     ecmrabbitpassword
    virtual-host: ecm

  # ── OAuth2 ──────────────────────────────────────────────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://integrator-3023444.okta.com/oauth2/ausykohz3k9z4e9Wy697

server:
  port: 8087

okta:
  oauth2:
    audience: api://sso-default

# ── ECM OCR config ──────────────────────────────────────────────────
ecm:
  minio:
    endpoint:         ${MINIO_ENDPOINT:http://localhost:9000}
    access-key:       ${MINIO_ACCESS_KEY:ecmminioadmin}
    secret-key:       ${MINIO_SECRET_KEY:ecmminio@password123}
    documents-bucket: ${MINIO_BUCKET:ecm-documents}

  opensearch:
    index-name: ecm-documents

  ocr:
    # ── General ────────────────────────────────────────────────────
    max-file-size-bytes: 52428800   # 50 MB — files above this skip OCR entirely
    tesseract-enabled:   true       # master switch; false = embedded text only

    # ── Tesseract Docker HTTP container ───────────────────────────
    #
    # When tesseract-server-enabled=true, the following content types are
    # sent to the container for OCR instead of calling a local binary:
    #
    #   image/*          → bytes sent directly as multipart POST
    #   application/pdf  → Tika extracts embedded text first;
    #                      if chars < scanned-pdf-text-threshold, each page
    #                      is rendered by PDFBox (300 DPI PNG) and sent to
    #                      the container individually
    #
    tesseract-server-enabled:         true
    tesseract-server-url:             ${TESSERACT_SERVER_URL:http://localhost:8884}

    # API path — adjust to match your container image:
    #   "/"           tesseract-server (npm), simpletesseract
    #   "/tesseract"  python-tesseract-api-server (nickswebsite)
    #   "/api/ocr"    custom wrappers
    tesseract-server-api-path:        ${TESSERACT_API_PATH:/tesseract}

    # Multipart field name the server expects for the image file
    tesseract-server-file-field:      ${TESSERACT_FILE_FIELD:file}

    # HTTP read timeout for a single Tesseract request (seconds)
    # High-res TIFFs and large PDF pages can take 20–40 s
    tesseract-server-timeout-seconds: ${TESSERACT_TIMEOUT_SECONDS:60}

    # ── Scanned PDF detection ──────────────────────────────────────
    #
    # If Tika extracts fewer than this many characters from a PDF, the
    # file is treated as a scanned PDF and page-by-page OCR is performed.
    # Raise to 200-500 if fillable/partial-text PDFs are being re-OCR'd
    # unnecessarily (they already have enough embedded text).
    scanned-pdf-text-threshold: 50

    # Maximum pages to OCR per scanned PDF.
    # Pages beyond the limit are skipped; a truncation note is appended.
    # Each A4 page at 300 DPI ≈ 3 MB PNG — peak heap ≈ 1 page at a time.
    scanned-pdf-max-pages: 100

    # DPI for rendering scanned PDF pages to images.
    # 300 = Tesseract recommended minimum. Use 150 to halve memory at
    # the cost of recognition accuracy on small fonts.
    scanned-pdf-render-dpi: 300

    # Tesseract language packs (used for both remote container and local binary)
    tesseract-languages: eng

  security:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200,http://localhost:3000}

management:
  # Micrometer tracing — sampling probability
  tracing:
    sampling:
      probability: 1.0     # 100% in dev; set to 0.1 (10%) in azure profile

  # OTLP exporter endpoint — where to send traces
  # Spring Boot 3.2+ auto-configures OtlpHttpSpanExporter when this is set
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces   # Jaeger OTLP/HTTP receiver
    # Prometheus metrics endpoint
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name} # label all metrics with service name

  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.ecm.ocr:                  DEBUG
    org.apache.tika:              WARN
    org.apache.pdfbox:            WARN
    org.springframework.security: INFO
    # Uncomment to trace HTTP calls to the Tesseract container:
    # org.springframework.web.client: DEBUG

# ── Azure profile ────────────────────────────────────────────────────
---
spring:
  config:
    activate:
      on-profile: azure
  datasource:
    url:      ${AZURE_DB_URL}
    username: ${AZURE_DB_USER}
    password: ${AZURE_DB_PASS}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OKTA_ISSUER_URI}
  rabbitmq:
    host:         ${RABBITMQ_HOST}
    port:         ${RABBITMQ_PORT:5672}
    username:     ${RABBITMQ_USER}
    password:     ${RABBITMQ_PASS}
    virtual-host: ${RABBITMQ_VHOST:ecm}
okta:
  oauth2:
    audience: ${OKTA_AUDIENCE}
ecm:
  minio:
    endpoint:   ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
  opensearch:
    host: ${OPENSEARCH_HOST}
    port: ${OPENSEARCH_PORT:9200}
  security:
    allowed-origins: ${CORS_ORIGINS}
  ocr:
    tesseract-server-enabled: true
    tesseract-server-url:     ${TESSERACT_SERVER_URL}
