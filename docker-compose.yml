version: '3.9'

services:

  # ─── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ecm-postgres
    mem_limit: 256m
    environment:
      POSTGRES_DB: ecmdb
      POSTGRES_USER: ecmuser
      POSTGRES_PASSWORD: ecmpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecmuser -d ecmdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecm-network

  # ─── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ecm-redis
    mem_limit: 64m
    ports:
      - "6379:6379"
    command: redis-server --requirepass ecmredispassword --maxmemory 48mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "ecmredispassword", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecm-network

  # ─── MinIO ───────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: ecm-minio
    mem_limit: 256m
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ecmminioadmin
      MINIO_ROOT_PASSWORD: ecmminio@password123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecm-network

  # ─── MinIO bucket setup ───────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: ecm-minio-init
    mem_limit: 64m
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        sleep 5;
        mc alias set local http://minio:9000 ecmminioadmin 'ecmminio@password123';
        mc mb --ignore-existing local/ecm-documents;
        mc mb --ignore-existing local/ecm-temp;
        mc mb --ignore-existing local/ecm-templates;
        mc mb --ignore-existing local/ecm-archive;
        echo 'Buckets ready';
        exit 0;
      "
    networks:
      - ecm-network

  # ─── RabbitMQ ────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: ecm-rabbitmq
    hostname: ecm-rabbitmq
    mem_limit: 256m
    environment:
      RABBITMQ_DEFAULT_USER: ecmrabbit
      RABBITMQ_DEFAULT_PASS: ecmrabbitpassword
      RABBITMQ_DEFAULT_VHOST: ecm
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit vm_memory_high_watermark 0.6"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - ecm-network

  # ─── OpenSearch ───────────────────────────────────────────────
  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: ecm-opensearch
    mem_limit: 512m
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms128m -Xmx256m
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL",
             "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - ecm-network

  # ─── Tesseract OCR (dev only) ─────────────────────────────────
  tesseract-ocr:
    image: hertzg/tesseract-server:latest
    container_name: ecm-tesseract
    mem_limit: 128m
    ports:
      - "8884:8884"
    networks:
      - ecm-network

  # ─── pgAdmin ──────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ecm-pgadmin
    mem_limit: 128m
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ecmapp.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5051:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecm-network

  # ── Jaeger All-in-One ────────────────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: ecm-jaeger
    mem_limit: 128m
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - LOG_LEVEL=warn
      - SPAN_STORAGE_TYPE=memory
      - MEMORY_MAX_TRACES=5000
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
      - "14268:14268"   # Jaeger HTTP (legacy)
    restart: unless-stopped
    networks:
      - ecm-network

  # ── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: ecm-prometheus
    mem_limit: 128m
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - ecm-network

  # ─── Mailpit (dev email testing) ──────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: ecm-mailpit
    mem_limit: 64m
    ports:
      - "1025:1025"    # SMTP
      - "8025:8025"    # Web UI
    restart: unless-stopped
    networks:
      - ecm-network

networks:
  ecm-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  rabbitmq_data:
  opensearch_data:
  pgadmin_data:
